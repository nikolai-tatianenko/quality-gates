# Built on macOS with Rust 1.95 and Tauri 2.12; Cargo.lock is committed. Windows is not built yet. See docs/DESKTOP.md.
[package]
name = "qualitygate-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
