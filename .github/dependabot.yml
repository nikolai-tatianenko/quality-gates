version: 2

# One pull request per week for every ecosystem together, instead of one per package.
# Security updates are separate: GitHub opens those as soon as an advisory lands.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: cargo
    directory: /packages/desktop/src-tauri
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
